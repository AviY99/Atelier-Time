name: D-127 Android compile (public GitHub logs)

on:
  push:
    branches:
      - android-native-kotlin-compose
    paths:
      - '.github/workflows/d127-android-compile.yml'
      - '.github/scripts/d127_extract_diagnostics.py'
      - 'android-native/app/src/main/**'
      - 'android-native/app/src/androidTest/**'
      - 'android-native/*.gradle.kts'
      - 'android-native/app/build.gradle.kts'
      - 'android-native/gradle.properties'
  workflow_dispatch:

# Source-only compile. No phone, tests, installation, app data, or secrets.
permissions:
  contents: read

concurrency:
  group: stage7-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-compile:
    if: github.repository == 'AviY99/Atelier-Time'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Android source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Compile D-127 app and UI test sources (NO test execution)
        id: compile
        shell: bash
        working-directory: android-native
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest \
            --console=plain --no-daemon 2>&1 | tee "$RUNNER_TEMP/d127-compilation.log"

      - name: Extract public-safe Kotlin error locations
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/d127_extract_diagnostics.py \
            "$RUNNER_TEMP/d127-compilation.log" \
            "$RUNNER_TEMP/d127-redacted-diagnostics.txt" \
            "$GITHUB_SHA" "${{ steps.compile.outcome }}"

      - name: Save targeted build diagnostics in GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d127-compiler-diagnostics
          path: ${{ runner.temp }}/d127-redacted-diagnostics.txt
          retention-days: 30
          if-no-files-found: warn
